<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bảng trong CSS</title>

    <style>
        table {
            width: 100%;
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
        }

        th {
            height: 50px;
        }

        th {
            text-align: left;
        }

        td {
            vertical-align: bottom;
        }

        th, td {
            padding: 10px;
        }

        th {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Bảng trong CSS</h1>

    <table>
        <tr>
            <th>Họ và tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>CNTT</td>
        </tr>
        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>KTPM</td>
        </tr>
        <tr>
            <td>Lê Văn C</td>
            <td>20</td>
            <td>HTTT</td>
        </tr>
    </table>

</body>
</html>
